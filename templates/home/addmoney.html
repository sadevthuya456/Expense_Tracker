{% load static%}
<!DOCTYPE html>
<html lang="en">
  <head>
    {% comment %}
    <link rel="stylesheet" type="text/css" href="try.css" />
    {% endcomment %}
    <link rel="stylesheet" type="text/css" href="{% static 'addmoney.css' %}" />
    <link rel="preconnect" href="https://fonts.gstatic.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Anton&display=swap"
      rel="stylesheet"
    />
    <title>My Wallet</title>
  </head>
  <body>
    <div class="bg-image"></div>

    <div class="bg-text">
      <div id="layoutAuthentication">
        <div id="layoutAuthentication_content">
          <main>
            <div class="container2">
              <div class="row justify-content-center">
                <div class="col-lg-5">
                  <div class="card shadow-lg border-0 rounded-lg mt-5">
                    <div class="card-header">
                      <h1 class="text-center font-weight-light my-4">
                        My Wallet
                      </h1>
                    </div>
                    <form method="post" action="/addmoney_submission/">
                      {% csrf_token %}

                      <div class="form-check">
                        What you want to add?<br />
                        <label class="form-check-label" for="add_money_expense">
                          <input class="form-check-input" type="radio" name="add_money"
                            id="add_money_expense" value="Expense" checked required />
                          Expense
                        </label>

                        <label class="form-check-label" for="add_money_income">
                          <input class="form-check-input" type="radio" name="add_money"
                            id="add_money_income" value="Income" required />
                          Income
                        </label>
                      </div>

                      <div>
                        <label for="quantity">Amount:</label><br />
                        <input
                          type="number"
                          name="quantity"
                          min="1"
                          minlength="1"
                          maxlength="120"
                          required
                        /><br />
                        <br />
                      </div>

                      <div>
                        <label>
                          Expense Date:
                          <input type="date" name="Date" required /> </label
                        ><br />
                      </div>
                      <div>
                        <div class="f1">
                          Select category-<br />
                          <select class="Category" name="Category" required>
                            {% for c in categories %}<option value="{{ c }}">{{ c }}</option>{% endfor %}
                          </select><br />
                      </div>
                      <div class="btn">
                        <button type="submit" class="b2" href="/addmoney">
                          Submit
                        </button>
                      </div>
                      <!--<input type="button" class="b2"  onclick="location.href='/addmoney'" value="submit!">-->
                    </form>
                  </div>
                </div>
              </div>
            </div>
          </main>
        </div>
      </div>
    </div>
  {{ category_map|json_script:"category-map" }}
<script>
  // Swap the category list when Expense / Income is chosen
  (function () {
    var map = JSON.parse(document.getElementById('category-map').textContent);
    var select = document.querySelector('select[name="Category"]');
    var radios = document.querySelectorAll('input[name="add_money"]');
    function fill(type) {
      var current = select.value;
      select.innerHTML = '';
      (map[type] || []).forEach(function (c) {
        var o = document.createElement('option');
        o.value = c; o.textContent = c;
        if (c === current) o.selected = true;
        select.appendChild(o);
      });
    }
    radios.forEach(function (r) {
      r.addEventListener('change', function () { if (r.checked) fill(r.value); });
    });
  })();
</script>
  </body>
</html>
