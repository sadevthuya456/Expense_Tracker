<!DOCTYPE html>
<html lang="en">
    <head>

        <link rel="stylesheet" type="text/css" href="{% static 'home.css' %}">

    </head>
    <body class="bg-primary">
        <div id="layoutAuthentication">
            <div id="layoutAuthentication_content">
                <main>
                    <div class="container2">
                        <div class="row justify-content-center">
                            <div class="col-lg-5">
                                <div class="card shadow-lg border-0 rounded-lg mt-5">
                                    <div class="card-header"><h3 class="text-center font-weight-light my-4">My Wallet</h3></div>
                                    <form method="post" action="{% url 'addmoney_update' addmoney_info.id %}">
                                    {% csrf_token %}
                  Edit <br>
                <div class="form-check">
  <input class="form-check-input" type="radio" name="add_money" id="add_money_expense" value="Expense" {% if addmoney_info.add_money == "Expense" %}checked{% endif %} required>
  <label class="form-check-label" for="add_money_expense">Expense</label>
</div>
<div class="form-check">
  <input class="form-check-input" type="radio" name="add_money" id="add_money_income" value="Income" {% if addmoney_info.add_money == "Income" %}checked{% endif %} required>
  <label class="form-check-label" for="add_money_income">Income</label>
</div>
																	<!--<form class="r1" method="post" action="\addmoney_submission\">
                                  {% csrf_token %}
	What you want to add?<br>
  <input type="radio" name="add_money" value="Expense">
  <label for="Expense">Expense</label>
  <input type="radio" name="add_money" value="Income">
  <label for="Income">Income</label><br>-->
  <label for="quantity">Amount:</label><br>
  <input type="number" name="quantity" min="1" value="{{ addmoney_info.quantity|cut:'-' }}" required><br>
  <br>
  <label>
    Expense Date:
    <input type="date" name="Date" value="{{addmoney_info.Date|date:'Y-m-d'}}" required>
  </label><br>
	<div class="f1">
		Select category-<br>
	<select class="Category" name="Category" required>
  {% for c in categories %}<option value="{{ c }}"{% if c == addmoney_info.Category %} selected{% endif %}>{{ c }}</option>{% endfor %}
</select><br>
																	</div>
  <button type="submit" class="b2"> Save </button>
	<!--<input type="button" class="b2"  onclick="location.href='/addmoney'" value="submit!">-->

																	</div>
											
													</div>
											</div></div></main></div></div></form>
    {{ category_map|json_script:"category-map" }}
<script>
  // Swap the category list when Expense / Income is chosen
  (function () {
    var map = JSON.parse(document.getElementById('category-map').textContent);
    var select = document.querySelector('select[name="Category"]');
    var radios = document.querySelectorAll('input[name="add_money"]');
    function fill(type) {
      var current = select.value;
      select.innerHTML = '';
      (map[type] || []).forEach(function (c) {
        var o = document.createElement('option');
        o.value = c; o.textContent = c;
        if (c === current) o.selected = true;
        select.appendChild(o);
      });
    }
    radios.forEach(function (r) {
      r.addEventListener('change', function () { if (r.checked) fill(r.value); });
    });
  })();
</script>
    </body>
</html>
